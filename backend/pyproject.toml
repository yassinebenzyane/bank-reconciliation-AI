[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-rapprochement"
version = "0.1.0"
description = "POC automatisation rapprochement bancaire ECO Steering"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.86",
    "litellm>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]